name: Bug report
description: Report a reproducible Code Janitor problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Code Janitor. Please include enough detail for someone else to reproduce the issue.
  - type: input
    id: version
    attributes:
      label: Code Janitor version
      description: Find this in the VS Code Extensions panel or package metadata.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - VS Code
        - Arduino IDE 2.x
        - CLI
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. Remove API keys, tokens, and private code before sharing.
      render: shell
